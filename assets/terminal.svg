<text x="40" y="118" font-size="17" fill="#E8D9A8" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" xml:space="preserve" opacity="0">$ mangudai scan example.com<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0333;0.0483;0.96;1" dur="18.0s" repeatCount="indefinite"/></text><text x="40" y="152" font-size="17" fill="#7EE787" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" xml:space="preserve" opacity="0">[+] Discovering subdomains ............ 14 hosts<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1222;0.1372;0.96;1" dur="18.0s" repeatCount="indefinite"/></text><text x="40" y="186" font-size="17" fill="#7EE787" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" xml:space="preserve" opacity="0">[+] Port scan ......................... 80, 443 open<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2111;0.2261;0.96;1" dur="18.0s" repeatCount="indefinite"/></text><text x="40" y="220" font-size="17" fill="#F2CC60" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" xml:space="preserve" opacity="0">[!] TLS certificate expires in 18 days<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3000;0.3150;0.96;1" dur="18.0s" repeatCount="indefinite"/></text><text x="40" y="254" font-size="17" fill="#F2CC60" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" xml:space="preserve" opacity="0">[!] Missing header: Content-Security-Policy<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3889;0.4039;0.96;1" dur="18.0s" repeatCount="indefinite"/></text><text x="40" y="288" font-size="17" fill="#F2CC60" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" xml:space="preserve" opacity="0">[!] DMARC policy is p=none (spoofing possible)<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4778;0.4928;0.96;1" dur="18.0s" repeatCount="indefinite"/></text><text x="40" y="322" font-size="17" fill="#E8D9A8" font-family="Consolas,Menlo,DejaVu Sans Mono,monospace" xml:space="pr